name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Debug
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d

      - name: Locate Compose File
        run: |
          find . -name docker-compose.yaml

      - name: Build
        run: |
          find
